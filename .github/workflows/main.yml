name: CI devops 2025

# Trigger the pipeline on every push to master/develop, and on every pull request
on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  test-backend:
    # GitHub-hosted runner (fresh VM with Docker preinstalled, needed by Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      # Get the repository code on the runner
      - uses: actions/checkout@v4

      # Install JDK 21 and cache Maven dependencies between runs
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Clean, compile, run unit + integration tests
      - name: Build and test with Maven
        run: mvn -B clean verify --file backend/pom.xml

      # Send the code analysis to SonarCloud (quality gate)
      - name: SonarCloud analysis
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=MegaiSa_tp-docker -Dsonar.organization=megaisa -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }} --file backend/pom.xml

  build-and-push-docker-image:
    # Run only if the backend compiles and all tests pass
    needs: test-backend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in only on master (secrets are not available on PRs from forks)
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/master'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Build every image on all branches, push only on master
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-backend:latest
          push: ${{ github.ref == 'refs/heads/master' }}

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-database:latest
          push: ${{ github.ref == 'refs/heads/master' }}

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-httpd:latest
          push: ${{ github.ref == 'refs/heads/master' }}
