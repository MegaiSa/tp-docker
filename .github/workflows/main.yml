name: CI devops 2025

# Trigger the pipeline on every push to master/develop, and on every pull request
on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  test-backend:
    # GitHub-hosted runner (fresh VM with Docker preinstalled, needed by Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      # Get the repository code on the runner
      - uses: actions/checkout@v4

      # Install JDK 21 and cache Maven dependencies between runs
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Clean, compile, run unit + integration tests
      - name: Build and test with Maven
        run: mvn -B clean verify --file backend/pom.xml
